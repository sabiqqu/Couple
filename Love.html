<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu ❤️</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    background:white;
    max-width:600px;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

img{
    width:220px;
    border-radius:15px;
}

h1{
    color:#ff4d6d;
}

p{
    line-height:1.7;
    color:#444;
}
</style>
</head>

<body>
<div class="card">
    <img src="https://picsum.photos/400/300" alt="Foto Kita">

    <h1>Untuk Sayangku ❤️</h1>

    <p>
        Terima kasih sudah hadir dalam hidupku.
        Semoga kita selalu bersama dalam suka maupun duka.
    </p>

    <p>
        Aku sayang kamu hari ini, besok, dan seterusnya.
    </p>

    <h2>💖 I Love You 💖</h2>
</div>
</body>
</html>
