<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Couple Page</title>

<style>
    body {
        margin: 0;
        font-family: 'Arial', sans-serif;
        background: #ffe6f0;
        overflow: hidden;
    }

    .page {
        width: 100%;
        height: 100vh;
        display: none;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        text-align: center;
    }

    .active {
        display: flex;
    }

    h1 {
        color: #d63384;
    }

    button {
        padding: 12px 25px;
        border: none;
        background: #ff4d6d;
        color: white;
        font-size: 18px;
        border-radius: 25px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #c9184a;
    }

    /* Bunga Lily */
    .flower {
        position: relative;
        width: 120px;
        height: 120px;
        animation: bloom 3s ease-in-out infinite alternate;
    }

    .petal {
        position: absolute;
        width: 60px;
        height: 100px;
        background: linear-gradient(#fff, #ffb6c1);
        border-radius: 50%;
        top: 10px;
        left: 30px;
        transform-origin: bottom center;
    }

    .petal:nth-child(1) { transform: rotate(0deg); }
    .petal:nth-child(2) { transform: rotate(60deg); }
    .petal:nth-child(3) { transform: rotate(120deg); }
    .petal:nth-child(4) { transform: rotate(180deg); }
    .petal:nth-child(5) { transform: rotate(240deg); }
    .petal:nth-child(6) { transform: rotate(300deg); }

    @keyframes bloom {
        0% { transform: scale(0.8); }
        100% { transform: scale(1.1); }
    }

    .center {
        width: 30px;
        height: 30px;
        background: gold;
        border-radius: 50%;
        position: absolute;
        top: 45px;
        left: 45px;
    }

</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="page1">
    <h1>Untuk kamu yang spesial 💖</h1>
    <p>Ada sesuatu kecil untukmu...</p>
    <button onclick="nextPage()">Klik di sini</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
    <h1>🌸 Lily Mekar untukmu 🌸</h1>

    <div class="flower">
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="petal"></div>
        <div class="center"></div>
    </div>

    <!-- Musik -->
    <audio id="music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8b6b6f3a0.mp3?filename=romantic-ambient-110401.mp3" type="audio/mpeg">
    </audio>

    <p>Semoga hari kamu seindah bunga ini 💕</p>
</div>

<script>
function nextPage() {
    document.getElementById("page1").classList.remove("active");
    document.getElementById("page2").classList.add("active");

    // play music
    let music = document.getElementById("music");
    music.play();
}
</script>

</body>
</html>
