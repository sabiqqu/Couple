<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Lily Bloom v2</title>

<style>
body {
    margin: 0;
    background: linear-gradient(#ffe6f0, #fff);
    font-family: Arial;
    overflow: hidden;
}

.page {
    width: 100%;
    height: 100vh;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.active {
    display: flex;
}

/* BUTTON */
button {
    padding: 12px 25px;
    border: none;
    background: #ff4d6d;
    color: white;
    font-size: 18px;
    border-radius: 25px;
    cursor: pointer;
}

/* ===== FLOWER AREA ===== */
.flower-wrap {
    position: relative;
    width: 200px;
    height: 400px;
    margin-top: 20px;
}

/* STEM */
.stem {
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 6px;
    height: 0;
    background: #2e8b57;
    transform: translateX(-50%);
    animation: growStem 2s forwards;
}

@keyframes growStem {
    from { height: 0; }
    to { height: 220px; }
}

/* FLOWER HEAD */
.flower {
    position: absolute;
    bottom: 180px;
    left: 50%;
    transform: translateX(-50%) translateY(60px) scale(0.3);
    opacity: 0;
    animation: riseBloom 3s 1.5s forwards;
}

/* RISE + BLOOM */
@keyframes riseBloom {
    0% {
        transform: translateX(-50%) translateY(80px) scale(0.3);
        opacity: 0;
    }
    50% {
        opacity: 1;
    }
    100% {
        transform: translateX(-50%) translateY(0px) scale(1);
        opacity: 1;
    }
}

/* PETALS */
.petal {
    position: absolute;
    width: 50px;
    height: 90px;
    background: linear-gradient(#fff, #ffb6c1);
    border-radius: 50%;
    top: 0;
    left: 25px;
    transform-origin: bottom center;
}

.petal:nth-child(1) { transform: rotate(0deg); }
.petal:nth-child(2) { transform: rotate(60deg); }
.petal:nth-child(3) { transform: rotate(120deg); }
.petal:nth-child(4) { transform: rotate(180deg); }
.petal:nth-child(5) { transform: rotate(240deg); }
.petal:nth-child(6) { transform: rotate(300deg); }

/* CENTER */
.center {
    position: absolute;
    width: 25px;
    height: 25px;
    background: gold;
    border-radius: 50%;
    top: 40px;
    left: 37px;
}

/* glow */
.glow {
    position: absolute;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, rgba(255,192,203,0.5), transparent);
    border-radius: 50%;
    top: -20px;
    left: -10px;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { transform: scale(0.9); opacity: 0.5; }
    to { transform: scale(1.2); opacity: 1; }
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="page1">
    <h1>Untuk kamu 💖</h1>
    <p>Ada bunga yang tumbuh spesial untukmu...</p>
    <button onclick="show()">Klik</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">

    <h1>🌸 Lily Bloom 🌸</h1>

    <div class="flower-wrap">

        <div class="stem"></div>

        <div class="flower">
            <div class="glow"></div>

            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>

            <div class="center"></div>
        </div>

    </div>

    <audio id="music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8b6b6f3a0.mp3?filename=romantic-ambient-110401.mp3">
    </audio>

    <p>Seperti bunga ini, perasaan ini tumbuh perlahan 💕</p>
</div>

<script>
function show() {
    document.getElementById("page1").classList.remove("active");
    document.getElementById("page2").classList.add("active");

    document.getElementById("music").play();
}
</script>

</body>
</html>
